[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", "app/ml_models", ".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "B008"]   # line-too-long handled by formatter; FastAPI Depends() is fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E402"]      # Script-level imports may come after sys.path manipulation

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --tb=short"
