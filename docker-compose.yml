services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindfulspend-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - USE_MOCK_GEMINI=${USE_MOCK_GEMINI:-false}
      - DATABASE_URL=sqlite:///./data/mindfulspend.db
      - CORS_ORIGINS=http://localhost:5173,http://frontend:5173
    volumes:
      - ./backend/data:/app/data
      - ./backend/app/ml_models:/app/app/ml_models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindfulspend-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: mindfulspend-network
